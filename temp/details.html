<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两个人的朋友圈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'AlibabaPuHuiTi-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
            display: flex;
            justify-content: center;
            color: #000;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 393px;
            height: 852px;
            background: #fff;
            overflow: hidden;
        }
        
        /* 顶部区域 */
        .top-bg {
            position: absolute;
            z-index: 0;
            left: 0;
            top: 0;
            width: 100%;
            height: 119px;
            background: url(https://img.js.design/assets/img/6874b379ba276a0e8a7faf46.png) center/cover;
        }
        
        .page-title {
            position: absolute;
            z-index: 1;
            left: 50%;
            top: 65px;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 400;
            white-space: nowrap;
            width: auto;
            overflow: visible;
            text-overflow: clip;
        }
        
        /* 头像区域 */
        .avatar {
            position: absolute;
            z-index: 2;
            left: 15px;
            top: 206px;
            width: 40px;
            height: 40px;
            border-radius: 5px;
            background: url(https://img.js.design/assets/img/6811c893321303f8e33eef48.jpg) center/cover;
        }
        
        /* 内容区域 */
        .content {
            position: absolute;
            z-index: 4;
            left: 76px;
            top: 206px;
            width: 293px;
            height: 321px;
        }
        
        .content-img {
            position: absolute;
            z-index: 0;
            left: 0;
            top: 81px;
            width: 187px;
            height: 240px;
            border-radius: 5px;
            background: url(https://img.js.design/assets/img/6766f1af2385a275717b9fef.jpg) center/cover;
        }
        
        .content-text {
            position: absolute;
            z-index: 1;
            left: 0;
            top: 27px;
            width: 293px;
            font-size: 14px;
            white-space: pre-wrap;
        }
        
        .author-name {
            position: absolute;
            z-index: 2;
            left: 0;
            top: 0;
            width: 48px;
            font-size: 16px;
            white-space: pre-wrap;
        }
        
        /* 功能图标 */
        .func-icon {
            position: absolute;
            z-index: 4;
            left: 15px;
            top: 63px;
            width: 24px;
            height: 24px;
            background: url(https://img.js.design/assets/element/js_I-w572ZwSOe/image/0ce39102a16101bf91b6c13c9d49ff47b0d2a4f5.png) center/cover;
        }
        
        /* 顶部信息栏 */
        .info-bar {
            position: absolute;
            z-index: 7;
            left: 17px;
            right: 17px;
            top: 117px;
            height: 34px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .left-elements {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-count {
            position: relative;
            z-index: 1;
            width: 109px;
            height: 34px;
        }
        
        .count-text {
            position: absolute;
            z-index: 0;
            left: 0;
            top: 0;
            height: 20px;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .count-img {
            position: absolute;
            z-index: 1;
            left: 0;
            top: 20px;
            width: 109px;
            height: 14px;
            background: url(https://img.js.design/assets/element/js_I-w572ZwSOe/image/b478a0367645693aace86ff3ba6d1f85f53a6792.png) center/cover;
        }
        
        .add-btn {
            width: 110.5px;
            height: 31px;
            background: url(https://img.js.design/assets/element/js_I-w572ZwSOe/image/2f0b2bc776a702d49292ae7334fe82b12b94542f.png) center/cover;
        }
        
        .setting-btn {
            position: relative;
            z-index: 1;
            width: 56px;
            height: 30px;
        }
        
        .btn-bg {
            position: absolute;
            z-index: 0;
            left: 0;
            top: 0;
            width: 56px;
            height: 30px;
            border-radius: 16px;
            background: #1a73e8;
        }
        
        .btn-text {
            position: absolute;
            z-index: 1;
            left: 16px;
            top: 6px;
            height: 18px;
            color: #fff;
            font-size: 12px;
            font-family: 'SourceHanSansCN-Regular';
            white-space: nowrap;
        }
        
        /* 时间和位置信息 */
        .time-location {
            position: absolute;
            z-index: 8;
            left: 76px;
            top: 542px;
            width: 282px;
            height: 20px;
        }
        
        .time-text {
            position: absolute;
            z-index: 0;
            left: 0;
            top: 0;
            height: 20px;
            color: #808080;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .location-img {
            position: absolute;
            z-index: 1;
            left: 242px;
            top: 0;
            width: 40px;
            height: 20px;
            background: url(https://img.js.design/assets/element/js_I-w572ZwSOe/image/f908e7c2f0efedfc30c3376b21d87fc5cc9f6d41.png) center/cover;
        }
        
        /* 评论区域 - 关键对齐参考点 */
        .comment-1 {
            position: absolute;
            z-index: 8;
            left: 105px;
            top: 636px;
            width: 69px;
            font-size: 13px;
            white-space: pre-wrap;
        }
        
        .comment-header-1 {
            position: absolute;
            z-index: 10;
            left: 75px; /* 评论头像左侧位置 */
            top: 612px;
            width: 133px;
            height: 20px; /* 评论头像高度 */
        }
        
        .comment-avatar {
            position: absolute;
            z-index: 0;
            left: 0;
            top: 0;
            width: 20px; /* 评论头像宽度 */
            height: 20px;
            border-radius: 50%;
            background: url(https://img.js.design/assets/img/6811c893321303f8e33eef48.jpg) center/cover;
        }
        
        .comment-author {
            position: absolute;
            z-index: 1;
            left: 30px; /* 评论作者文字左侧位置（头像宽度+间距） */
            top: 1px;
            height: 18px;
            color: #808080;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .comment-2 {
            position: absolute;
            z-index: 10;
            left: 105px;
            top: 688px;
            width: 192px;
            font-size: 13px;
            white-space: pre-wrap;
        }
        
        .comment-header-2 {
            position: absolute;
            z-index: 12;
            left: 75px;
            top: 664px;
            width: 133px;
            height: 20px;
        }
        
        .comment-3 {
            position: absolute;
            z-index: 12;
            left: 105px;
            top: 740px;
            width: 192px;
            font-size: 13px;
            white-space: pre-wrap;
        }
        
        .comment-header-3 {
            position: absolute;
            z-index: 14;
            left: 75px;
            top: 716px;
            width: 210px;
            height: 20px;
        }
        
        .mention {
            color: #1a73e8;
        }
        
        /* 点赞区域 - 精确对齐设置 */
        .like-section {
            position: absolute;
            z-index: 15;
            left: 75px; /* 与评论头像左侧对齐 */
            top: 580px;
            width: 200px;
            height: 20px; /* 与评论头像高度一致，确保垂直居中 */
            overflow: visible;
        }
        
        .like-container {
            display: flex;
            align-items: center; /* 垂直居中对齐 */
            height: 100%;
        }
        
        .like-icon {
            width: 18px;
            height: 18px;
            background: url(https://img.js.design/assets/element/js_I-w572ZwSOe/image/602fd316ab992d5ec635a4d895d3e499c2190dec.png) no-repeat center/contain;
            flex-shrink: 0;
            margin-right: 10px; /* 与评论头像到文字的间距一致（30px-20px=10px） */
        }
        
        .like-info {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .like-author-text {
            font-size: 14px;
            white-space: nowrap;
            /* 此元素左侧与评论中"孙鹏远"文字左侧精确对齐 */
        }
        
        .like-text {
            color: #808080;
            font-size: 14px;
            white-space: nowrap;
        }
        
        /* 回复按钮 */
        .reply-1 {
            position: absolute;
            z-index: 15;
            left: 177px;
            top: 636px;
            height: 18px;
            color: #808080;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .reply-2 {
            position: absolute;
            z-index: 16;
            left: 202px;
            top: 740px;
            height: 18px;
            color: #808080;
            font-size: 13px;
            white-space: nowrap;
        }
        
        .reply-icon-1 {
            position: absolute;
            z-index: 17;
            left: 218px;
            top: 638px;
            width: 14px;
            height: 14px;
            background: url(https://img.js.design/assets/element/js_I-w572ZwSOe/image/297bbfba6d2206a0e6f69e23af5c421ec48eb68d.png) center/cover;
        }
        
        .reply-icon-2 {
            position: absolute;
            z-index: 18;
            left: 302px;
            top: 690px;
            width: 14px;
            height: 14px;
            background: url(https://img.js.design/assets/element/js_I-w572ZwSOe/image/297bbfba6d2206a0e6f69e23af5c421ec48eb68d.png) center/cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bg"></div>
        <div class="page-title">两个人的朋友圈</div>
        <div class="avatar"></div>
        
        <div class="content">
            <div class="content-img"></div>
            <div class="content-text">秋天的气息越发浓郁，关于你的讯息我越发好奇。</div>
            <div class="author-name">孙鹏远</div>
        </div>
        
        <div class="func-icon"></div>
        
        <div class="info-bar">
            <div class="left-elements">
                <div class="user-count">
                    <div class="count-text">2 名用户在内</div>
                    <div class="count-img"></div>
                </div>
                <div class="add-btn"></div>
            </div>
            
            <div class="setting-btn">
                <div class="btn-bg"></div>
                <div class="btn-text">设置</div>
            </div>
        </div>
        
        <div class="time-location">
            <div class="time-text">2分钟前 · 上海市 虹桥火车站</div>
            <div class="location-img"></div>
        </div>
        
        <!-- 点赞区域 - 精确对齐 -->
        <div class="like-section">
            <div class="like-container">
                <div class="like-icon"></div>
                <div class="like-info">
                    <div class="like-author-text">孙鹏远</div>
                    <div class="like-text">觉得很赞</div>
                </div>
            </div>
        </div>
        
        <div class="comment-1">感觉很棒！</div>
        <div class="comment-header-1">
            <div class="comment-avatar"></div>
            <div class="comment-author">孙鹏远 · 15分钟前</div>
        </div>
        
        <div class="comment-2">感觉确实很不多，我下次也要去！</div>
        <div class="comment-header-2">
            <div class="comment-avatar"></div>
            <div class="comment-author">孙鹏远 · 15分钟前</div>
        </div>
        
        <div class="comment-3">你举得怎么样？</div>
        <div class="comment-header-3">
            <div class="comment-avatar"></div>
            <div class="comment-author">孙鹏远 · 回复 <span class="mention">@叶子</span> · 15分钟前</div>
        </div>
        
        <div class="reply-1">回复</div>
        <div class="reply-2">回复</div>
        <div class="reply-icon-1"></div>
        <div class="reply-icon-2"></div>
    </div>
</body>
</html>
