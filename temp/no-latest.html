<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朋友圈创建卡片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        ::-webkit-scrollbar {
            display: none;
        }
        
        /* 基础样式 */
        .text {
            position: absolute;
            display: flex;
            flex-direction: column;
            font-weight: 400;
            white-space: nowrap;
        }
        
        .frame {
            position: absolute;
            mix-blend-mode: normal;
        }
        
        .image {
            position: absolute;
            z-index: 0;
            border: none !important;
            box-shadow: none;
        }
        
        .image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            opacity: 1;
        }
        
        /* 页面容器 */
        .page-container {
            position: relative;
            width: 393px;
            height: 852px;
            background: #fff;
            overflow: hidden;
            margin: 0 auto;
            padding-top: 181px;
        }
        
        /* 核心卡片区域 */
        .empty-state-frame {
            left: 21px;
            top: 181px;
            width: 353px;
            height: 139px;
            z-index: 2;
        }
        
        .empty-bg {
            left: -3px;
            top: -3px;
            width: 359px;
            height: 145px;
            border-radius: 3.98px;
        }
        
        .empty-bg::before {
            background-image: url(https://img.js.design/assets/element/js_RlZE3svwfmD/image/3f8493c2a8fcd5ef6c203c7022acf1499443e5ec.png);
            border-radius: 3.98px;
        }
        
        .empty-title {
            left: 106px;
            top: 22px;
            height: 21px;
            color: #000;
            font-size: 14px;
            font-family: 'SourceHanSansCN-Regular';
            z-index: 1;
        }
        
        .empty-desc {
            left: 38px;
            top: 49px;
            height: 18px;
            color: #808080;
            font-size: 12px;
            font-family: 'SourceHanSansCN-Regular';
            z-index: 2;
            white-space: normal;
            width: 270px;
            text-align: center;
        }
        
        .divider {
            left: 19px;
            top: 86.5px;
            width: 313.57px;
            height: 1px;
            z-index: 3;
        }
        
        .divider::before {
            background-image: url(https://img.js.design/assets/element/js_RlZE3svwfmD/image/c1c635d8a4dac00bbeaff4ffa67eb969e99a59ed.png);
        }
        
        .create-btn {
            left: 141px;
            top: 102px;
            height: 21px;
            color: #1a73e8;
            font-size: 14px;
            font-weight: 700;
            font-family: 'SourceHanSansCN-Bold';
            z-index: 4;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="page-container">
        <!-- 仅保留核心卡片区域 -->
        <div class="frame empty-state-frame">
            <div class="image empty-bg"></div>
            <div class="text empty-title">没有正在进行的朋友圈</div>
            <div class="text empty-desc">点击“创建朋友圈”按钮，邀请朋友或扫一扫开始吧</div>
            <div class="image divider"></div>
            <div class="text create-btn">创建朋友圈</div>
        </div>
    </div>
</body>
</html>
